
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدول علوم رياضة 🚀</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --accent: #f59e0b;
            --success: #10b981;
            --dark: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.1) 0%, transparent 40%);
        }

        /* حاوية التطبيق */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 80px; /* مساحة للفوتر */
        }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header-text h1 {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .settings-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        /* نافذة اختيار القسم */
        .section-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .section-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--glass-border);
            transform: scale(0.9);
            transition: 0.3s;
        }

        .section-modal.active .modal-content {
            transform: scale(1);
        }

        .modal-content h3 { margin-bottom: 15px; }
        
        .modal-content select {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid var(--primary);
            color: white;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }

        .save-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }

        /* شريط الأيام */
        .days-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .days-scroll::-webkit-scrollbar { display: none; }

        .day-pill {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 50px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            transition: 0.3s;
        }

        .day-pill.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            border-color: var(--primary);
        }

        /* الكروت */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* شريط ملون بجانب الكارت */
        .card::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--text-secondary);
        }

        .card.theory::before { background: var(--primary); }
        .card.practical::before { background: var(--accent); }
        .card.lab::before { background: var(--success); }

        .time-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
            text-align: center;
        }

        .time-val {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text);
            line-height: 1;
        }

        .time-period {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .info-col {
            flex: 1;
        }

        .subject-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: white;
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .icon-col {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        
        .card.theory .icon-col { color: #818cf8; }
        .card.practical .icon-col { color: #fbbf24; }
        .card.lab .icon-col { color: #34d399; }

        /* رسالة فارغة */
        .empty-msg {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .empty-msg i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.3;
            display: block;
        }

        /* شريط الحالة السفلي */
        .status-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            font-size: 0.8rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 50;
            white-space: nowrap;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animations delay for cards */
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="header-text">
                <h1>أهلاً يا بطل 💪</h1>
                <p>علوم الرياضة - الفرقة الثانية</p>
            </div>
            <div class="settings-btn" onclick="openModal()">
                <i class="fa-solid fa-sliders"></i>
            </div>
        </header>

        <!-- Days Navigation -->
        <div class="days-scroll">
            <div class="day-pill active" onclick="changeDay('saturday', this)">السبت</div>
            <div class="day-pill" onclick="changeDay('monday', this)">الإثنين</div>
            <div class="day-pill" onclick="changeDay('tuesday', this)">الثلاثاء</div>
            <div class="day-pill" onclick="changeDay('wednesday', this)">الأربعاء</div>
        </div>

        <!-- Schedule Container -->
        <div id="timeline" class="timeline">
            <!-- Cards Injected Here -->
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
        <i class="fa-solid fa-user-group"></i>
        <span id="currentGroupLabel">جاري التحميل...</span>
    </div>

    <!-- Modal for Section Selection -->
    <div class="section-modal" id="sectionModal">
        <div class="modal-content">
            <h3>اختر مجموعتك الدراسية</h3>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px;">لتحديد جدول العملي بدقة</p>
            <select id="sectionSelect">
                <option value="1-4">الأقسام من 1 إلى 4</option>
                <option value="5-8">الأقسام من 5 إلى 8</option>
                <option value="9-12">الأقسام من 9 إلى 12</option>
                <option value="13-16">الأقسام من 13 إلى 16</option>
            </select>
            <button class="save-btn" onclick="saveSection()">حفظ واستمرار</button>
        </div>
    </div>

    <script>
        // --- البيانات ---
        const schedule = {
            saturday: [
                { t: '8-10', s: 'تشريح وظيفي', l: 'مدرج 1', d: 'أ.د/ سمير', type: 'theory', icon: 'fa-bone' },
                { t: '10-12', s: 'مبادئ الترويح', l: 'مدرج 1', d: 'د/ أمل', type: 'theory', icon: 'fa-umbrella-beach' },
                { t: '12-2', s: 'رياضة وصحة المجتمع', l: 'مدرج 1', d: 'د/ نسرين', type: 'theory', icon: 'fa-heart-pulse' },
                { t: '2-4', s: 'حاسب آلي (نظري)', l: 'مدرج 1', d: 'أ.د/ مرتضى', type: 'theory', icon: 'fa-laptop-code' },
                { t: '4-5', s: 'نظري كرة يد', l: 'مدرج 1', d: 'أ.د/ كمال', type: 'theory', icon: 'fa-futbol' },
                { t: '5-6', s: 'نظري مسابقات ميدان', l: 'مدرج 1', d: 'أ.د/ ليلى', type: 'theory', icon: 'fa-person-running' },
                { t: '6-7', s: 'نظري هوكي', l: 'مدرج 1', d: 'أ.د/ خالد', type: 'theory', icon: 'fa-hockey-puck' },
                { t: '7-8', s: 'نظري ملاكمة', l: 'مدرج 1', d: 'أ.د/ محمود', type: 'theory', icon: 'fa-hand-fist' }
            ],
            monday: {
                "1-4": [
                    { t: '8-10', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '10-12', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '12-2', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '2-4', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' }
                ],
                "5-8": [
                    { t: '8-10', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '10-12', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '12-2', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '2-4', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' }
                ],
                "9-12": [
                    { t: '8-10', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '10-12', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '12-2', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '2-4', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' }
                ],
                "13-16": [
                    { t: '8-10', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '10-12', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '12-2', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '2-4', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' }
                ]
            },
            tuesday: [
                { t: '8-12', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الأولى', type: 'lab', icon: 'fa-computer' },
                { t: '12-4', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الثانية', type: 'lab', icon: 'fa-computer' }
            ],
            wednesday: {
                "1-4": [
                    { t: '8-10', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '10-12', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '12-2', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '2-4', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' }
                ],
                "5-8": [
                    { t: '8-10', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '10-12', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '12-2', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '2-4', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' }
                ],
                "9-12": [
                    { t: '8-10', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '10-12', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '12-2', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '2-4', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' }
                ],
                "13-16": [
                    { t: '8-10', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '10-12', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '12-2', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '2-4', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' }
                ]
            }
        };

        // --- المتغيرات والحالة ---
        let currentSection = localStorage.getItem('studentSection');
        let currentDay = 'saturday';

        const modal = document.getElementById('sectionModal');
        const timeline = document.getElementById('timeline');
        const statusLabel = document.getElementById('currentGroupLabel');
        const pills = document.querySelectorAll('.day-pill');

        // --- عند بدء التشغيل ---
        window.onload = function() {
            // التحقق من وجود قسم محفوظ
            if (!currentSection) {
                setTimeout(() => modal.classList.add('active'), 500); // إظهار النافذة ببطء
            } else {
                statusLabel.innerText = `مجموعتك الحالية: ${currentSection}`;
                document.getElementById('sectionSelect').value = currentSection;
            }

            // تحديد اليوم تلقائياً بناءً على تاريخ الجهاز
            autoSelectDay();
            render();
        };

        // --- الوظائف ---

        function openModal() {
            modal.classList.add('active');
        }

        function saveSection() {
            const val = document.getElementById('sectionSelect').value;
            currentSection = val;
            localStorage.setItem('studentSection', val);
            statusLabel.innerText = `مجموعتك الحالية: ${val}`;
            modal.classList.remove('active');
            render();
        }

        function autoSelectDay() {
            const today = new Date().getDay(); // 0=Sun, 1=Mon... 6=Sat
            
            // خريطة تحويل رقم اليوم لاسم اليوم في البيانات
            const dayMap = {
                6: 'saturday',
                1: 'monday',
                2: 'tuesday',
                3: 'wednesday'
            };

            // إذا كان اليوم الجمعة أو الأحد أو الخميس (أيام أجازة) نفتح على السبت
            if (dayMap[today]) {
                currentDay = dayMap[today];
                // تحديث الـ UI للزر النشط
                pills.forEach(p => p.classList.remove('active'));
                const targetPill = Array.from(pills).find(p => p.getAttribute('onclick').includes(currentDay));
                if(targetPill) targetPill.classList.add('active');
            }
        }

        function changeDay(day, element) {
            currentDay = day;
            pills.forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            render();
        }

        function render() {
            timeline.innerHTML = '';
            let data = [];

            // المنطق: هل اليوم يحتاج تقسيم مجموعات؟
            if (currentDay === 'monday' || currentDay === 'wednesday') {
                if (!currentSection) {
                     // حالة نادرة اذا لم يختر القسم بعد
                     data = []; 
                } else {
                    data = schedule[currentDay][currentSection];
                }
            } else {
                data = schedule[currentDay];
            }

            // حالة لا يوجد بيانات
            if (!data || data.length === 0) {
                timeline.innerHTML = `
                    <div class="empty-msg">
                        <i class="fa-solid fa-mug-hot"></i>
                        <p>لا يوجد محاضرات مسجلة أو لم يتم تحديد القسم.</p>
                    </div>
                `;
                return;
            }

            // رسم الكروت
            data.forEach((item) => {
                const docHtml = item.d ? `<div class="meta-item"><i class="fa-solid fa-user-tie"></i> ${item.d}</div>` : '';
                
                const html = `
                    <div class="card ${item.type}">
                        <div class="time-col">
                            <span class="time-val">${item.t}</span>
                            <span class="time-period">توقيت</span>
                        </div>
                        <div class="info-col">
                            <div class="subject-title">${item.s}</div>
                            <div class="meta-info">
                                <div class="meta-item"><i class="fa-solid fa-location-dot"></i> ${item.l}</div>
                                ${docHtml}
                            </div>
                        </div>
                        <div class="icon-col">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                    </div>
                `;
                timeline.innerHTML += html;
            });
        }
    </script>
</body>
</html>
