<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدول رمضان | علوم رياضة 🌙</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1; /* Indigo indicating spirituality */
            --accent: #f59e0b;  /* Gold for Ramadan */
            --success: #10b981;
            --dark: #0f172a;
            --glass: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            /* خلفية رمضانية ليلية */
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(99, 102, 241, 0.15) 0%, transparent 40%);
        }

        /* زخرفة بسيطة (هلال) */
        .ramadan-decor {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            color: var(--accent);
            opacity: 0.8;
            transform: rotate(-15deg);
        }

        /* حاوية التطبيق */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 90px;
        }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .header-text h1 {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(to right, #fff, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .settings-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            width: 45px;
            height: 45px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        /* نافذة اختيار القسم */
        .section-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            backdrop-filter: blur(8px);
        }

        .section-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 24px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--glass-border);
            transform: scale(0.9);
            transition: 0.3s;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .section-modal.active .modal-content {
            transform: scale(1);
        }

        .modal-content h3 { margin-bottom: 10px; color: var(--accent); }
        
        .modal-content select {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        .save-btn {
            background: linear-gradient(135deg, var(--primary), #4338ca);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        /* شريط الأيام */
        .days-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .days-scroll::-webkit-scrollbar { display: none; }

        .day-pill {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 10px 22px;
            border-radius: 50px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            transition: 0.3s;
        }

        .day-pill.active {
            background: var(--accent);
            color: #0f172a;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
            border-color: var(--accent);
        }

        /* الكروت */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        /* شريط ملون بجانب الكارت */
        .card::before {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0; width: 5px;
        }

        .card.theory::before { background: var(--primary); }
        .card.practical::before { background: var(--accent); }
        .card.lab::before { background: var(--success); }

        .time-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 65px;
            text-align: center;
            background: rgba(255,255,255,0.03);
            padding: 8px 5px;
            border-radius: 12px;
        }

        .time-val {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text);
            line-height: 1;
        }

        .time-period {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .info-col { flex: 1; }

        .subject-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: white;
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.2);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .icon-col {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        
        .card.theory .icon-col { color: #a5b4fc; }
        .card.practical .icon-col { color: #fcd34d; }
        .card.lab .icon-col { color: #6ee7b7; }

        /* رسالة فارغة */
        .empty-msg {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-msg i {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: var(--glass-border);
            display: block;
        }

        /* شريط الحالة السفلي */
        .status-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            font-size: 0.85rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 50;
            white-space: nowrap;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* تأخير الانميشن */
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }

    </style>
</head>
<body>

    <div class="app-container">
        <i class="fa-solid fa-moon ramadan-decor"></i>

        <header>
            <div class="header-text">
                <h1>رمضان كريم 🌙</h1>
                <p><i class="fa-solid fa-graduation-cap"></i> علوم رياضة - الفرقة الثانية</p>
            </div>
            <div class="settings-btn" onclick="openModal()">
                <i class="fa-solid fa-sliders"></i>
            </div>
        </header>

        <div class="days-scroll">
            <div class="day-pill active" onclick="changeDay('saturday', this)">السبت</div>
            <div class="day-pill" onclick="changeDay('monday', this)">الإثنين</div>
            <div class="day-pill" onclick="changeDay('tuesday', this)">الثلاثاء</div>
            <div class="day-pill" onclick="changeDay('wednesday', this)">الأربعاء</div>
        </div>

        <div id="timeline" class="timeline">
            </div>
    </div>

    <div class="status-bar" id="statusBar" onclick="openModal()">
        <i class="fa-solid fa-layer-group"></i>
        <span id="currentGroupLabel">جاري التحميل...</span>
    </div>

    <div class="section-modal" id="sectionModal">
        <div class="modal-content">
            <i class="fa-solid fa-mosque" style="font-size: 3rem; color: #334155; margin-bottom:15px;"></i>
            <h3>اختر مجموعتك</h3>
            <p style="font-size: 0.85rem; color: #94a3b8;">لعرض جدول العملي والحاسب الصحيح</p>
            <select id="sectionSelect">
                <option value="1-4">الأقسام من 1 إلى 4</option>
                <option value="5-8">الأقسام من 5 إلى 8</option>
                <option value="9-12">الأقسام من 9 إلى 12</option>
                <option value="13-16">الأقسام من 13 إلى 16</option>
            </select>
            <button class="save-btn" onclick="saveSection()">حفظ الجدول</button>
        </div>
    </div>

    <script>
        // --- بيانات الجدول الرمضاني الجديد ---
        const schedule = {
            saturday: [
                { t: '8-10', s: 'تشريح وظيفي', l: 'مدرج 1', d: 'أ.د/ سمير', type: 'theory', icon: 'fa-bone' },
                { t: '10-12', s: 'مبادئ الترويح', l: 'مدرج 1', d: 'د/ أمل', type: 'theory', icon: 'fa-umbrella-beach' },
                { t: '12-2', s: 'رياضة وصحة المجتمع', l: 'مدرج 1', d: 'د/ نسرين', type: 'theory', icon: 'fa-heart-pulse' },
                { t: '2-4', s: 'حاسب آلي (نظري)', l: 'مدرج 1', d: 'أ.د/ مرتضى', type: 'theory', icon: 'fa-laptop-code' },
                { t: '4-5', s: 'نظري كرة يد', l: 'مدرج 1', d: 'أ.د/ كمال & السباعي', type: 'theory', icon: 'fa-futbol' },
                { t: '5-6', s: 'نظري مسابقات ميدان', l: 'مدرج 1', d: 'أ.د/ ليلى & إسماعيل', type: 'theory', icon: 'fa-person-running' },
                { t: '6-7', s: 'نظري هوكي', l: 'مدرج 1', d: 'أ.د/ خالد أبو السعود', type: 'theory', icon: 'fa-hockey-puck' },
                { t: '7-8', s: 'نظري ملاكمة', l: 'مدرج 1', d: 'أ.د/ محمود العربي', type: 'theory', icon: 'fa-hand-fist' }
            ],
            // جدول العملي ليوم الاثنين (تبادلي)
            monday: {
                "1-4": [
                    { t: '8-10', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '10-12', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '12-2', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '2-4', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' }
                ],
                "5-8": [
                    { t: '8-10', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '10-12', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '12-2', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '2-4', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' }
                ],
                "9-12": [
                    { t: '8-10', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '10-12', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '12-2', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '2-4', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' }
                ],
                "13-16": [
                    { t: '8-10', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '10-12', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '12-2', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '2-4', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' }
                ]
            },
            // جدول الثلاثاء (حاسب آلي) - تم ربط الأقسام بالمجموعات
            // المجموعة الأولى = 1-8 ، المجموعة الثانية = 9-16
            tuesday: {
                "1-4": [
                    { t: '8-10', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الأولى ج1', type: 'lab', icon: 'fa-computer' },
                    { t: '10-12', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الأولى ج2', type: 'lab', icon: 'fa-microchip' }
                ],
                "5-8": [
                    { t: '8-10', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الأولى ج1', type: 'lab', icon: 'fa-computer' },
                    { t: '10-12', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الأولى ج2', type: 'lab', icon: 'fa-microchip' }
                ],
                "9-12": [
                    { t: '12-2', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الثانية ج1', type: 'lab', icon: 'fa-computer' },
                    { t: '2-4', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الثانية ج2', type: 'lab', icon: 'fa-microchip' }
                ],
                "13-16": [
                    { t: '12-2', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الثانية ج1', type: 'lab', icon: 'fa-computer' },
                    { t: '2-4', s: 'حاسب آلي (عملي)', l: 'معمل الحاسب', d: 'المجموعة الثانية ج2', type: 'lab', icon: 'fa-microchip' }
                ]
            },
            // جدول العملي ليوم الأربعاء (تبادلي)
            wednesday: {
                "1-4": [
                    { t: '8-10', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '10-12', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '12-2', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '2-4', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' }
                ],
                "5-8": [
                    { t: '8-10', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '10-12', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '12-2', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '2-4', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' }
                ],
                "9-12": [
                    { t: '8-10', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '10-12', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '12-2', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { t: '2-4', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' }
                ],
                "13-16": [
                    { t: '8-10', s: 'كرة يد', l: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { t: '10-12', s: 'مسابقات الميدان', l: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { t: '12-2', s: 'هوكي', l: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { t: '2-4', s: 'ملاكمة', l: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' }
                ]
            }
        };

        // --- المنطق البرمجي ---
        let currentSection = localStorage.getItem('studentSection');
        let currentDay = 'saturday';

        const modal = document.getElementById('sectionModal');
        const timeline = document.getElementById('timeline');
        const statusLabel = document.getElementById('currentGroupLabel');
        const pills = document.querySelectorAll('.day-pill');

        window.onload = function() {
            if (!currentSection) {
                setTimeout(() => modal.classList.add('active'), 600);
            } else {
                statusLabel.innerText = `${currentSection}`;
                document.getElementById('sectionSelect').value = currentSection;
            }
            autoSelectDay();
            render();
        };

        function openModal() { modal.classList.add('active'); }

        function saveSection() {
            const val = document.getElementById('sectionSelect').value;
            currentSection = val;
            localStorage.setItem('studentSection', val);
            statusLabel.innerText = `${val}`;
            modal.classList.remove('active');
            render();
        }

        function autoSelectDay() {
            const today = new Date().getDay(); 
            const dayMap = { 6: 'saturday', 1: 'monday', 2: 'tuesday', 3: 'wednesday' };
            if (dayMap[today]) {
                currentDay = dayMap[today];
                pills.forEach(p => p.classList.remove('active'));
                const targetPill = Array.from(pills).find(p => p.getAttribute('onclick').includes(currentDay));
                if(targetPill) targetPill.classList.add('active');
            }
        }

        function changeDay(day, element) {
            currentDay = day;
            pills.forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            render();
        }

        function render() {
            timeline.innerHTML = '';
            let data = [];

            // تحديد البيانات بناءً على اليوم والقسم
            if (currentDay === 'saturday') {
                data = schedule[currentDay];
            } else {
                if (currentSection && schedule[currentDay]) {
                    data = schedule[currentDay][currentSection];
                }
            }

            // حالة عدم وجود بيانات
            if (!data || data.length === 0) {
                timeline.innerHTML = `
                    <div class="empty-msg">
                        <i class="fa-solid fa-mug-hot"></i>
                        <p>لا توجد محاضرات في هذا اليوم أو لم تقم باختيار المجموعة.</p>
                    </div>
                `;
                return;
            }

            // رسم الكروت
            data.forEach((item, index) => {
                const docHtml = item.d ? `<div class="meta-item"><i class="fa-solid fa-user-tie"></i> ${item.d}</div>` : '';
                
                // إضافة تأخير بسيط للأنميشن
                const animationDelay = index * 0.1;
                
                const html = `
                    <div class="card ${item.type}" style="animation-delay: ${animationDelay}s">
                        <div class="time-col">
                            <span class="time-val">${item.t}</span>
                            <span class="time-period">رمضان</span>
                        </div>
                        <div class="info-col">
                            <div class="subject-title">${item.s}</div>
                            <div class="meta-info">
                                <div class="meta-item"><i class="fa-solid fa-location-dot"></i> ${item.l}</div>
                                ${docHtml}
                            </div>
                        </div>
                        <div class="icon-col">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                    </div>
                `;
                timeline.innerHTML += html;
            });
        }
    </script>
</body>
</html>
