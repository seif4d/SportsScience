
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدول رمضان 🌙 علوم رياضة</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #fbbf24; /* ذهبي رمضاني */
            --primary-glow: rgba(251, 191, 36, 0.4);
            --bg-deep: #0f172a; /* كحلي غامق */
            --bg-card: rgba(30, 41, 59, 0.65);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231e293b' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"),
                radial-gradient(circle at top, #1e3a8a, var(--bg-deep));
            padding-bottom: 80px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Ramadan Style */
        header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .ramadan-icon {
            font-size: 3rem;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary-glow);
            animation: float 3s ease-in-out infinite;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: bold;
            background: rgba(251, 191, 36, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        /* Controls */
        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        .controls-bar::-webkit-scrollbar { display: none; }

        .day-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .day-btn.active {
            background: var(--primary);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 15px var(--primary-glow);
            border-color: var(--primary);
        }

        /* Timeline Cards */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.5s ease-out forwards;
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 4px;
            background: var(--text-muted);
        }

        .card.theory::after { background: #60a5fa; }
        .card.practical::after { background: var(--primary); }
        .card.lab::after { background: var(--accent-green); }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 65px;
            text-align: center;
            border-left: 1px solid var(--border);
            padding-left: 10px;
        }

        .time-start {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text);
            line-height: 1;
        }

        .time-end {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .info-box {
            flex: 1;
        }

        .subject {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 3px;
            color: #fff;
        }

        .details {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .badge {
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* Settings Floating Button */
        .fab {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 100;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--primary);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.15);
        }

        .modal-box h2 {
            margin-bottom: 10px;
            color: var(--primary);
        }

        select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin: 15px 0;
            font-size: 1rem;
        }

        .btn-save {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Empty State */
        .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .empty i { font-size: 3rem; margin-bottom: 10px; color: var(--border); }

        /* Current Group Bar */
        .status-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="ramadan-icon"><i class="fa-solid fa-moon"></i></div>
            <h1>جدول شهر رمضان</h1>
            <div class="subtitle">الفرقة الثانية - بنين 2025</div>
        </header>

        <!-- Days Navigation -->
        <div class="controls-bar">
            <div class="day-btn" onclick="setDay('saturday', this)">السبت</div>
            <div class="day-btn" onclick="setDay('monday', this)">الإثنين</div>
            <div class="day-btn" onclick="setDay('tuesday', this)">الثلاثاء</div>
            <div class="day-btn" onclick="setDay('wednesday', this)">الأربعاء</div>
        </div>

        <!-- Schedule Cards -->
        <div id="timeline" class="timeline">
            <!-- Content Injected via JS -->
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <i class="fa-solid fa-users"></i> <span id="groupDisplay">...</span>
    </div>

    <!-- Settings Button -->
    <div class="fab" onclick="showModal()">
        <i class="fa-solid fa-gear"></i>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-box">
            <i class="fa-solid fa-lantern fa-2x" style="color:var(--primary); margin-bottom:10px;"></i>
            <h2>إعدادات القسم</h2>
            <p style="color:var(--text-muted); font-size:0.9rem;">اختر رقم قسمك لعرض جدول العملي بدقة</p>
            
            <select id="sectionSelect">
                <option value="1-4">الأقسام (1 - 4)</option>
                <option value="5-8">الأقسام (5 - 8)</option>
                <option value="9-12">الأقسام (9 - 12)</option>
                <option value="13-16">الأقسام (13 - 16)</option>
            </select>
            
            <button class="btn-save" onclick="saveSettings()">حفظ - رمضان كريم</button>
        </div>
    </div>

    <script>
        // --- بيانات جدول رمضان الجديد ---
        const ramadanData = {
            saturday: [
                { start: '8:00', end: '9:00', sub: 'تشريح وظيفي', doc: 'أ.د/ سمير', loc: 'مدرج 1', type: 'theory', icon: 'fa-bone' },
                { start: '9:00', end: '10:00', sub: 'مبادئ الترويح', doc: 'د/ أمل', loc: 'مدرج 1', type: 'theory', icon: 'fa-umbrella-beach' },
                { start: '10:00', end: '11:00', sub: 'رياضة وصحة مجتمع', doc: 'د/ نسرين', loc: 'مدرج 1', type: 'theory', icon: 'fa-heart-pulse' },
                { start: '11:00', end: '12:00', sub: 'حاسب آلي (نظري)', doc: 'أ.د/ مرتضى', loc: 'مدرج 1', type: 'theory', icon: 'fa-laptop-code' },
                { start: '12:00', end: '12:30', sub: 'نظري كرة يد', doc: 'أ.د/ كمال', loc: 'مدرج 1', type: 'theory', icon: 'fa-futbol' },
                { start: '12:30', end: '1:00', sub: 'نظري مسابقات ميدان', doc: 'أ.د/ ليلى', loc: 'مدرج 1', type: 'theory', icon: 'fa-person-running' },
                { start: '1:00', end: '1:30', sub: 'نظري هوكي', doc: 'أ.د/ خالد', loc: 'مدرج 1', type: 'theory', icon: 'fa-hockey-puck' },
                { start: '1:30', end: '2:00', sub: 'نظري ملاكمة', doc: 'أ.د/ محمود', loc: 'مدرج 1', type: 'theory', icon: 'fa-hand-fist' }
            ],
            monday: {
                "1-4": [
                    { start: '8:00', end: '9:00', sub: 'كرة يد', loc: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { start: '9:00', end: '10:00', sub: 'مسابقات ميدان', loc: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { start: '10:00', end: '11:00', sub: 'هوكي', loc: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { start: '11:00', end: '12:00', sub: 'ملاكمة', loc: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' }
                ],
                "5-8": [
                    { start: '8:00', end: '9:00', sub: 'مسابقات ميدان', loc: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { start: '9:00', end: '10:00', sub: 'كرة يد', loc: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { start: '10:00', end: '11:00', sub: 'ملاكمة', loc: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { start: '11:00', end: '12:00', sub: 'هوكي', loc: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' }
                ],
                "9-12": [
                    { start: '8:00', end: '9:00', sub: 'هوكي', loc: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { start: '9:00', end: '10:00', sub: 'ملاكمة', loc: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { start: '10:00', end: '11:00', sub: 'كرة يد', loc: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { start: '11:00', end: '12:00', sub: 'مسابقات ميدان', loc: 'الاستاد', type: 'practical', icon: 'fa-person-running' }
                ],
                "13-16": [
                    { start: '8:00', end: '9:00', sub: 'ملاكمة', loc: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { start: '9:00', end: '10:00', sub: 'هوكي', loc: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { start: '10:00', end: '11:00', sub: 'مسابقات ميدان', loc: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { start: '11:00', end: '12:00', sub: 'كرة يد', loc: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' }
                ]
            },
            tuesday: [
                { start: '8:00', end: '9:00', sub: 'حاسب آلي (ج1)', doc: 'مجموعة 1', loc: 'معمل الحاسب', type: 'lab', icon: 'fa-desktop' },
                { start: '9:00', end: '10:00', sub: 'حاسب آلي (ج2)', doc: 'مجموعة 1', loc: 'معمل الحاسب', type: 'lab', icon: 'fa-desktop' },
                { start: '10:00', end: '11:00', sub: 'حاسب آلي (ج1)', doc: 'مجموعة 2', loc: 'معمل الحاسب', type: 'lab', icon: 'fa-desktop' },
                { start: '11:00', end: '12:00', sub: 'حاسب آلي (ج2)', doc: 'مجموعة 2', loc: 'معمل الحاسب', type: 'lab', icon: 'fa-desktop' }
            ],
            wednesday: {
                "1-4": [
                    { start: '8:00', end: '9:00', sub: 'ملاكمة', loc: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { start: '9:00', end: '10:00', sub: 'هوكي', loc: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { start: '10:00', end: '11:00', sub: 'مسابقات ميدان', loc: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { start: '11:00', end: '12:00', sub: 'كرة يد', loc: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' }
                ],
                "5-8": [
                    { start: '8:00', end: '9:00', sub: 'هوكي', loc: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { start: '9:00', end: '10:00', sub: 'ملاكمة', loc: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { start: '10:00', end: '11:00', sub: 'كرة يد', loc: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { start: '11:00', end: '12:00', sub: 'مسابقات ميدان', loc: 'الاستاد', type: 'practical', icon: 'fa-person-running' }
                ],
                "9-12": [
                    { start: '8:00', end: '9:00', sub: 'مسابقات ميدان', loc: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { start: '9:00', end: '10:00', sub: 'كرة يد', loc: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { start: '10:00', end: '11:00', sub: 'ملاكمة', loc: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' },
                    { start: '11:00', end: '12:00', sub: 'هوكي', loc: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' }
                ],
                "13-16": [
                    { start: '8:00', end: '9:00', sub: 'كرة يد', loc: 'ملاعب المرور', type: 'practical', icon: 'fa-futbol' },
                    { start: '9:00', end: '10:00', sub: 'مسابقات ميدان', loc: 'الاستاد', type: 'practical', icon: 'fa-person-running' },
                    { start: '10:00', end: '11:00', sub: 'هوكي', loc: 'الملاعب القديمة', type: 'practical', icon: 'fa-hockey-puck' },
                    { start: '11:00', end: '12:00', sub: 'ملاكمة', loc: 'صالة الملاكمة', type: 'practical', icon: 'fa-hand-fist' }
                ]
            }
        };

        // --- منطق التطبيق ---
        let userSection = localStorage.getItem('ramadanSection');
        let currentDay = 'saturday';

        const modal = document.getElementById('settingsModal');
        const timeline = document.getElementById('timeline');
        const groupDisplay = document.getElementById('groupDisplay');

        // عند التحميل
        window.onload = function() {
            if(!userSection) {
                setTimeout(showModal, 500);
            } else {
                updateGroupDisplay();
                document.getElementById('sectionSelect').value = userSection;
            }
            autoSelectDay();
            renderSchedule();
        }

        function showModal() { modal.classList.add('active'); }
        
        function saveSettings() {
            const val = document.getElementById('sectionSelect').value;
            userSection = val;
            localStorage.setItem('ramadanSection', val);
            updateGroupDisplay();
            modal.classList.remove('active');
            renderSchedule();
        }

        function updateGroupDisplay() {
            groupDisplay.textContent = `مجموعة ${userSection || 'غير محدد'}`;
        }

        function autoSelectDay() {
            const dayIndex = new Date().getDay();
            const daysMap = { 6: 'saturday', 1: 'monday', 2: 'tuesday', 3: 'wednesday' };
            
            if(daysMap[dayIndex]) {
                currentDay = daysMap[dayIndex];
            } else {
                currentDay = 'saturday'; // الافتراضي
            }
            
            // تحديث الزر النشط
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(currentDay)) {
                    btn.classList.add('active');
                }
            });
        }

        function setDay(day, el) {
            currentDay = day;
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderSchedule();
        }

        function renderSchedule() {
            timeline.innerHTML = '';
            let data = [];

            // جلب البيانات بناء على اليوم
            if (currentDay === 'monday' || currentDay === 'wednesday') {
                if(userSection && ramadanData[currentDay][userSection]) {
                    data = ramadanData[currentDay][userSection];
                }
            } else {
                data = ramadanData[currentDay];
            }

            if (!data || data.length === 0) {
                timeline.innerHTML = `
                    <div class="empty">
                        <i class="fa-solid fa-mug-hot"></i>
                        <p>لا يوجد محاضرات مسجلة أو لم يتم تحديد القسم!</p>
                    </div>`;
                return;
            }

            // رسم الكروت
            data.forEach((item, index) => {
                // تأخير الحركة لكل كرت
                const delay = index * 0.1;
                
                const docHtml = item.doc ? `<div class="badge"><i class="fa-solid fa-user-tie"></i> ${item.doc}</div>` : '';
                
                const card = `
                    <div class="card ${item.type}" style="animation-delay: ${delay}s">
                        <div class="time-box">
                            <div class="time-start">${item.start}</div>
                            <div class="time-end">${item.end}</div>
                        </div>
                        <div class="info-box">
                            <div class="subject">${item.sub}</div>
                            <div class="details">
                                <div class="badge"><i class="fa-solid fa-location-dot"></i> ${item.loc}</div>
                                ${docHtml}
                            </div>
                        </div>
                        <div class="icon-circle">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                    </div>
                `;
                timeline.innerHTML += card;
            });
        }
    </script>
</body>
</html>
