<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار أساسيات المناهج - المتوقع</title>
    <!-- استيراد خط عربي جميل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --success-color: #2a9d8f;
            --error-color: #e63946;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4361ee 0%, #4cc9f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: rgba(67, 97, 238, 0.1);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .score-box {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e9ecef;
        }

        .progress-bar {
            height: 100%;
            background: var(--success-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Screens */
        .screen {
            padding: 40px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            display: none; /* Hidden by default */
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: flex;
        }

        /* Start Screen */
        .start-screen h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .start-screen p {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Quiz Screen */
        .quiz-screen {
            align-items: stretch;
            text-align: right;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.5;
            color: var(--text-color);
        }

        .options-grid {
            display: grid;
            gap: 15px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
            position: relative;
            font-weight: 600;
        }

        .option-btn:hover:not([disabled]) {
            background: #e7f5ff;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: #d4edda;
            border-color: var(--success-color);
            color: #155724;
        }

        .option-btn.wrong {
            background: #f8d7da;
            border-color: var(--error-color);
            color: #721c24;
        }

        .next-btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            align-self: flex-end;
            display: none; /* Hidden until answer selected */
        }

        /* Result Screen */
        .result-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .result-message {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #495057;
        }

        /* Main Button Style */
        .btn-main {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
            transition: transform 0.2s;
        }

        .btn-main:hover {
            transform: scale(1.05);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                border-radius: 0;
                height: 100vh;
                max-height: 100vh;
            }
            .screen {
                padding: 20px;
            }
            .question-text {
                font-size: 1.2rem;
            }
            .start-screen h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="header">
        <div class="logo">كويز المناهج 🥋</div>
        <div class="score-box">النقاط: <span id="currentScore">0</span></div>
    </div>

    <!-- Start Screen -->
    <div class="screen start-screen active" id="startScreen">
        <h1>تحدي أساسيات المناهج</h1>
        <p>مرحباً يا بطل! 📝🔥<br>
        هذا الاختبار يحتوي على أهم الأسئلة المتوقعة (صح/خطأ واختياري).<br>
        راجع معلوماتك واستعد للامتحان.<br>
        عدد الأسئلة: <span id="totalQuestionsCount"></span> سؤال</p>
        <button class="btn-main" onclick="startQuiz()">ابدأ التحدي 🚀</button>
    </div>

    <!-- Quiz Screen -->
    <div class="screen quiz-screen" id="quizScreen">
        <div class="question-count" style="margin-bottom: 10px; color: #888; font-size: 0.9rem;">
            سؤال <span id="qIndex">1</span> من <span id="qTotal">100</span>
        </div>
        <div class="question-text" id="questionText">
            نص السؤال سيظهر هنا...
        </div>
        <div class="options-grid" id="optionsGrid">
            <!-- Options will be injected here -->
        </div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ⬅️</button>
    </div>

    <!-- Result Screen -->
    <div class="screen result-screen" id="resultScreen">
        <div class="result-icon" id="resultIcon">🏆</div>
        <h2>النتيجة النهائية</h2>
        <div class="final-score" id="finalScoreDisplay">0 / 0</div>
        <p class="result-message" id="resultMessage">أداء رائع!</p>
        <button class="btn-main" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
    </div>
</div>

<script>
    // Database of Questions
    // تم دمج وتنسيق جميع الأسئلة الواردة في الطلب
    const questionsDB = [
        // --- صح وخطأ (محولة لصيغة اختيارات) ---
        { q: "المنهج بمفهومه الحديث يركز على حشو عقول التلاميذ بالمعلومات فقط؟", options: ["صح", "خطأ"], answer: 1 },

        { q: "يعد 'التوازن' و'التتابع' و'المدى' من محددات تخطيط المنهج؟", options: ["صح", "خطأ"], answer: 0 },

        { q: "كلمة 'منهج' (Curriculum) في الأصل اللاتيني تعني 'مجموعة الكتب الدراسية'؟", options: ["صح", "خطأ"], answer: 1 },

        { q: "عند التخطيط للوحدة التعليمية، نبدأ باختيار الأنشطة والألعاب قبل تحديد الأهداف؟", options: ["صح", "خطأ"], answer: 1 },
        { q: "يُراعي برنامج علاج السمنة الجانب النفسي للطالب بجانب الجانب البدني؟", options: ["صح", "خطأ"], answer: 0 },

        { q: "يجب أن تتاح الأنشطة الرياضية للموهوبين فقط؟", options: ["صح", "خطأ"], answer: 1 },

    let currentQuestionIndex = 0;

    let userAnswers = [];

    // DOM Elements
    const startScreen = document.getElementById('startScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const questionText = document.getElementById('questionText');
    const optionsGrid = document.getElementById('optionsGrid');
    const nextBtn = document.getElementById('nextBtn');
    const qIndexSpan = document.getElementById('qIndex');
    const qTotalSpan = document.getElementById('qTotal');
    const currentScoreSpan = document.getElementById('currentScore');
    const progressBar = document.getElementById('progressBar');
    const finalScoreDisplay = document.getElementById('finalScoreDisplay');
    const resultMessage = document.getElementById('resultMessage');
    const resultIcon = document.getElementById('resultIcon');

    // Display total questions count on start screen
    document.getElementById('totalQuestionsCount').textContent = questionsDB.length;

    function startQuiz() {
        startScreen.classList.remove('active');
        quizScreen.classList.add('active');
        currentQuestionIndex = 0;
        score = 0;
        currentScoreSpan.textContent = 0;
        qTotalSpan.textContent = questionsDB.length;
        
        // Shuffle questions for randomness (Optional - can be removed to keep order)
        // questionsDB.sort(() => Math.random() - 0.5);
        
        showQuestion();
    }

    function showQuestion() {
        const question = questionsDB[currentQuestionIndex];
        questionText.textContent = question.q;
        qIndexSpan.textContent = currentQuestionIndex + 1;
        
        // Update Progress Bar
        const progressPercent = ((currentQuestionIndex) / questionsDB.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        // Clear previous options
        optionsGrid.innerHTML = '';
        nextBtn.style.display = 'none';

        // Create option buttons
        question.options.forEach((option, index) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.textContent = option;
            btn.onclick = () => selectAnswer(index, btn);
            optionsGrid.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex, selectedBtn) {
        // Prevent changing answer
        const allOptions = optionsGrid.querySelectorAll('.option-btn');
        allOptions.forEach(btn => btn.style.pointerEvents = 'none');

        const currentQuestion = questionsDB[currentQuestionIndex];
        const correctIndex = currentQuestion.answer;

        // Visual feedback
        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add('correct');
            score++;
            currentScoreSpan.textContent = score;
            playFeedback(true);
        } else {
            selectedBtn.classList.add('wrong');
            // Highlight the correct one
            allOptions[correctIndex].classList.add('correct');
            playFeedback(false);
        }

        // Show Next Button
        nextBtn.style.display = 'block';
        
        // Auto scroll to next button on mobile
        nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questionsDB.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
        progressBar.style.width = '100%';

        finalScoreDisplay.textContent = `${score} / ${questionsDB.length}`;
        
        const percentage = (score / questionsDB.length) * 100;
        
        if (percentage >= 90) {
            resultMessage.textContent = "أنت أسطورة! 🥋 امتياز يا كوتش";
            resultIcon.textContent = "👑";
        } else if (percentage >= 75) {
            resultMessage.textContent = "ممتاز جداً! 🔥 استمر";
            resultIcon.textContent = "🤩";
        } else if (percentage >= 50) {
            resultMessage.textContent = "جيد، لكن تحتاج للمراجعة 📚";
            resultIcon.textContent = "🤔";
        } else {
            resultMessage.textContent = "محتاج تذاكر بضمير يا بطل! 😅";
            resultIcon.textContent = "🤕";
        }
    }

    function restartQuiz() {
        resultScreen.classList.remove('active');
        startQuiz();
    }

    // Optional: Add simple visual shake/pulse via CSS class adding
    function playFeedback(isCorrect) {
        const container = document.querySelector('.container');
        if(!isCorrect) {
            container.style.animation = "shake 0.5s";
            setTimeout(() => container.style.animation = "none", 500);
        }
    }

    // Add Keyframe for shake dynamically
    const styleSheet = document.createElement("style");
    styleSheet.innerText = `
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    `;
    document.head.appendChild(styleSheet);

</script>
