<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي أولمبياد رفع الأثقال 🏋️‍♂️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        :root {
            --primary: #FF3E3E; /* أحمر رياضي */
            --secondary: #2D2D2D; /* أسود فحمي */
            --accent: #FFD700; /* ذهبي */
            --success: #00C851;
            --wrong: #ff4444;
            --bg-grad: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-grad);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* الخلفية المتحركة */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 62, 62, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            opacity: 0.5;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100vh; /* للموبايل */
            max-height: 900px;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        @media (min-width: 600px) {
            .app-container {
                height: 90vh;
                margin: 20px;
            }
        }

        /* --- الهيدر وشريط التقدم --- */
        .game-header {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border);
        }

        .stats-box {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .streak-counter {
            background: rgba(255, 165, 0, 0.2);
            color: orange;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .streak-counter.active {
            opacity: 1;
            transform: scale(1);
        }

        .progress-bar-container {
            height: 6px;
            background: rgba(255,255,255,0.1);
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--primary);
        }

        /* --- الشاشات --- */
        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.4s ease;
        }

        .screen.active {
            display: flex;
        }

        /* شاشة البداية */
        .start-screen {
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, var(--secondary), #444);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4em;
            margin-bottom: 20px;
            border: 4px solid var(--primary);
            box-shadow: 0 0 30px rgba(255, 62, 62, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2.2em;
            margin: 10px 0;
            background: linear-gradient(to right, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #aaa;
            font-size: 1.1em;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* الأزرار */
        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.2em;
            border-radius: 50px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 62, 62, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            width: 80%;
            max-width: 300px;
        }

        .btn-main:active {
            transform: scale(0.95);
        }

        .btn-main::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-main:hover::after {
            left: 100%;
        }

        /* شاشة الأسئلة */
        .question-card {
            background: var(--glass);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: var(--border);
            text-align: center;
        }

        .q-tag {
            background: rgba(255,255,255,0.1);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85em;
            display: inline-block;
            margin-bottom: 15px;
        }

        .q-text {
            font-size: 1.3em;
            line-height: 1.5;
            font-weight: 700;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            width: 100%;
        }

        .option-card {
            background: rgba(50,50,50,0.8);
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            position: relative;
            overflow: hidden;
        }

        .option-card:hover {
            background: rgba(70,70,70,0.9);
            transform: translateY(-2px);
        }

        .option-card.correct {
            background: rgba(0, 200, 81, 0.2);
            border-color: var(--success);
            color: #fff;
        }

        .option-card.wrong {
            background: rgba(255, 68, 68, 0.2);
            border-color: var(--wrong);
            animation: shake 0.5s;
        }

        /* Input specific */
        .input-wrapper {
            width: 100%;
            text-align: center;
        }
        
        .custom-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 2px solid #555;
            padding: 15px;
            font-size: 1.2em;
            color: white;
            border-radius: 10px;
            text-align: center;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .custom-input:focus {
            border-color: var(--primary);
        }

        /* شاشة النتيجة */
        .result-screen {
            text-align: center;
            justify-content: center;
            align-items: center;
        }

        .medal-icon {
            font-size: 6em;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-big {
            font-size: 3.5em;
            font-weight: 900;
            color: var(--accent);
            margin: 10px 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .feedback-text {
            font-size: 1.2em;
            color: #ddd;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .seif{    
    margin-top: 15px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 1px;
    text-decoration: none;
    background: var(--secondary);
    /* padding: 20px; */
    border-radius: 21px;
    padding: 0 12px;
}

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Canvas for confetti */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

    </style>
</head>
<body>

    <div class="bg-pattern"></div>
    <canvas id="confetti-canvas"></canvas>

    <div class="app-container">
        
        <!-- Progress Bar (Always visible in game) -->
        <div class="progress-bar-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <!-- 1. Start Screen -->
        <div class="screen active start-screen" id="startScreen">
            <div class="logo-circle">🏋️</div>
            <h1>تحدي الاثقال</h1>
            <p class="subtitle">35 سؤالاً تحدد مستواك<br><a href="https://www.facebook.com/profile.php?id=61577044333150" class="seif">Seif X DebiaN</a></p>
            <button class="btn-main" onclick="game.start()">ابــدأ البطولــة</button>
        </div>

        <!-- 2. Game Screen -->
        <div class="screen" id="gameScreen">
            <div class="game-header">
                <div class="stats-box">
                    <span style="font-size: 1.2em;">🏆 <span id="scoreDisplay">0</span></span>
                </div>
                <div class="streak-counter" id="streakBadge">
                    🔥 <span id="streakCount">0</span> Combo
                </div>
                <div style="color: #888; font-size: 0.9em;">
                    <span id="qCurrent">1</span>/<span id="qTotal">35</span>
                </div>
            </div>

            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <div class="question-card">
                    <span class="q-tag" id="qTag">اختياري</span>
                    <div class="q-text" id="qText">السؤال يظهر هنا...</div>
                </div>

                <div class="options-grid" id="optionsArea">
                    <!-- خيارات الإجابة ستظهر هنا -->
                </div>

                <div class="input-wrapper" id="inputArea" style="display: none;">
                    <input type="text" class="custom-input" id="textInput" placeholder="اكتب الإجابة هنا..." autocomplete="off">
                    <button class="btn-main" style="margin-top: 15px; width: 100%;" onclick="game.checkInput()">تأكيد</button>
                </div>
            </div>
        </div>

        <!-- 3. Result Screen -->
        <div class="screen result-screen" id="resultScreen">
            <div class="medal-icon" id="finalMedal">🥇</div>
            <h2>نتيجة البطولة</h2>
            <div class="score-big"><span id="finalScore">0</span>%</div>
            <p class="feedback-text" id="finalMsg">أداء ممتاز!</p>
            
            <div style="display: grid; gap: 10px; width: 100%; max-width: 300px;">
                <button class="btn-main" style="width: 100%; background: var(--secondary);" onclick="location.reload()">محاولة أخرى 🔄</button>
            </div>
        </div>

    </div>

<script>
    /* --- Sound System (Synthesizer) --- */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    const playSound = (type) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'win') {
            // Simple arpeggio
            [0, 0.1, 0.2, 0.4].forEach((t, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.type = 'triangle';
                o.frequency.value = 400 + (i * 100);
                g.gain.value = 0.05;
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.5);
                o.start(audioCtx.currentTime + t);
                o.stop(audioCtx.currentTime + t + 0.5);
            });
        }
    };

    /* --- Confetti Effect --- */
    const confetti = {
        start: () => {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            let particles = [];
            const colors = ['#FF3E3E', '#FFD700', '#00C851', '#33b5e5'];

            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 5 + 2,
                    angle: Math.random() * 6.2
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    p.y += p.speed;
                    p.x += Math.sin(p.angle) * 2;
                    if(p.y > canvas.height) p.y = -10;
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    };

    /* --- Data --- */
    const questions = [
        { t: 'mcq', q: "تأسس الاتحاد الدولي لرفع الأثقال (IWF) عام؟", o: ["1896", "1905", "1930", "1972"], a: 1 },
        { t: 'mcq', q: "وزن 'بار' الرجال المعتمد في المسابقات هو؟", o: ["15 كجم", "20 كجم", "25 كجم", "10 كجم"], a: 1 },
        { t: 'mcq', q: "أول ذهبية لمصر (السيد نصير) كانت في دورة؟", o: ["برلين 1936", "لندن 1948", "أمستردام 1928", "أنتويرب 1920"], a: 2 },
        { t: 'mcq', q: "أقصى عرض مسموح به لحزام رفع الأثقال هو؟", o: ["10 سم", "12 سم", "15 سم", "8 سم"], a: 1 },
        { t: 'mcq', q: "لون قرص (طارة) الوزن 25 كجم هو؟", o: ["أزرق", "أصفر", "أخضر", "أحمر"], a: 3 },
        { t: 'mcq', q: "الزمن الممنوح للاعب لأداء المحاولة الواحدة؟", o: ["30 ثانية", "دقيقة واحدة", "دقيقتان", "3 دقائق"], a: 1 },
        { t: 'mcq', q: "القبضة الأقوى والأكثر استخداماً هي؟", o: ["العادية", "العكسية", "الخطافية", "المفتوحة"], a: 2 },
        { t: 'mcq', q: "تم إلغاء رفعة 'الضغط' نهائياً عام؟", o: ["1972", "1976", "2000", "1920"], a: 0 },
        { t: 'mcq', q: "عدد المحاولات القانونية لكل لاعب في الرفعة؟", o: ["2", "3", "4", "5"], a: 1 },
        { t: 'mcq', q: "مساحة اللوحة الخشبية (المنصة) تبلغ؟", o: ["3x3 م", "4x4 م", "5x5 م", "2x2 م"], a: 1 },
        { t: 'mcq', q: "قطر بار السيدات يبلغ ... ملم؟", o: ["25", "28", "30", "20"], a: 0 },
        { t: 'mcq', q: "في الخطف، يُرفع الثقل من الأرض إلى؟", o: ["الصدر", "الركبة", "فوق الرأس مباشرة", "الكتفين"], a: 2 },
        { t: 'mcq', q: "لمس الكوع للركبة في رفعة الكلين يعتبر؟", o: ["صحيح", "محاولة فاشلة", "مسموح للناشئين", "لا يؤثر"], a: 1 },
        { t: 'mcq', q: "يبدأ الميزان الرسمي قبل المسابقة بمدة؟", o: ["ساعة", "ساعتين", "3 ساعات", "30 دقيقة"], a: 1 },
        { t: 'mcq', q: "مرحلة 'الانفجار' وتوليد القوة هي؟", o: ["السحبة الأولى", "السحبة الثانية", "التوازن", "الوقوف"], a: 1 },
        { t: 'mcq', q: "أقل زيادة مسموح بها في الوزن؟", o: ["2.5 كجم", "1 كجم", "0.5 كجم", "5 كجم"], a: 1 },
        { t: 'mcq', q: "لقب 'معجزة برلين 1936' هو للبطل؟", o: ["محمد إيهاب", "خضر التوني", "محمود فياض", "إبراهيم شمس"], a: 1 },
        { t: 'mcq', q: "المسافة الداخلية بين 'كُمي' البار تبلغ؟", o: ["131 سم", "220 سم", "201 سم", "50 سم"], a: 0 },
        { t: 'mcq', q: "عدد حكام المنصة هو؟", o: ["5", "3", "1", "4"], a: 1 },
        { t: 'mcq', q: "وقت اللاعب عند أداء محاولتين متتاليتين؟", o: ["دقيقة", "دقيقة ونصف", "دقيقتان", "3 دقائق"], a: 2 },
        // صح وخطأ
        { t: 'tf', q: "المنافسات حالياً 3 رفعات: ضغط، خطف، كلين ونتر.", a: false },
        { t: 'tf', q: "وزن بار السيدات 15 كجم ولونه أصفر.", a: true },
        { t: 'tf', q: "يسمح برباط ضاغط على الكوع.", a: false },
        { t: 'tf', q: "الطريقة الجزئية العكسية جيدة للمبتدئين.", a: true },
        { t: 'tf', q: "مسكة الكلين أوسع من الخطف.", a: false },
        { t: 'tf', q: "حركة (Press out) تعتبر رفعة صحيحة.", a: false },
        { t: 'tf', q: "يجب أن يحلق البار قريباً من الجسم.", a: true },
        { t: 'tf', q: "أول مشاركة لمصر كانت في أنتويرب 1920.", a: true },
        { t: 'tf', q: "يسمح للمدرب بالوقوف على المنصة.", a: false },
        { t: 'tf', q: "يجوز تغيير الوزن مرتين في المحاولة الواحدة.", a: true },
        // أكمل
        { t: 'in', q: "لون القرص وزن 20 كجم هو:", a: ["أزرق", "ازرق"] },
        { t: 'in', q: "لون القرص وزن 10 كجم هو:", a: ["أخضر", "اخضر"] },
        { t: 'in', q: "طول بار الرجال (سم):", a: ["220"] },
        { t: 'in', q: "طول بار السيدات (سم):", a: ["210"] },
        { t: 'in', q: "وزن المحبس الواحد (كجم):", a: ["2.5", "2,5"] }
    ];

    /* --- Game Engine --- */
    const game = {
        score: 0,
        streak: 0,
        idx: 0,
        isBusy: false,

        ui: {
            start: document.getElementById('startScreen'),
            game: document.getElementById('gameScreen'),
            result: document.getElementById('resultScreen'),
            qText: document.getElementById('qText'),
            opts: document.getElementById('optionsArea'),
            inputArea: document.getElementById('inputArea'),
            input: document.getElementById('textInput'),
            score: document.getElementById('scoreDisplay'),
            streakBadge: document.getElementById('streakBadge'),
            streakCount: document.getElementById('streakCount'),
            progress: document.getElementById('progressBar'),
            qCurrent: document.getElementById('qCurrent'),
            qTotal: document.getElementById('qTotal'),
            qTag: document.getElementById('qTag')
        },

        start() {
            this.ui.start.classList.remove('active');
            this.ui.game.classList.add('active');
            this.score = 0;
            this.streak = 0;
            this.idx = 0;
            this.ui.qTotal.innerText = questions.length;
            this.loadQ();
        },

        loadQ() {
            this.isBusy = false;
            const q = questions[this.idx];
            
            // UI Updates
            this.ui.qCurrent.innerText = this.idx + 1;
            this.ui.progress.style.width = `${(this.idx / questions.length) * 100}%`;
            this.ui.qText.innerText = q.q;
            this.ui.opts.innerHTML = '';
            this.ui.input.value = '';
            
            // Handling Streak UI
            if(this.streak > 1) {
                this.ui.streakBadge.classList.add('active');
                this.ui.streakCount.innerText = this.streak;
            } else {
                this.ui.streakBadge.classList.remove('active');
            }

            // Render Inputs based on Type
            if (q.t === 'mcq') {
                this.ui.qTag.innerText = 'اختر الإجابة';
                this.ui.inputArea.style.display = 'none';
                this.ui.opts.style.display = 'grid';
                this.ui.opts.className = "options-grid";
                
                q.o.forEach((opt, i) => {
                    const btn = document.createElement('div');
                    btn.className = 'option-card';
                    btn.innerText = opt;
                    btn.onclick = () => this.check(i, btn);
                    this.ui.opts.appendChild(btn);
                });

            } else if (q.t === 'tf') {
                this.ui.qTag.innerText = 'صح أم خطأ';
                this.ui.inputArea.style.display = 'none';
                this.ui.opts.style.display = 'grid';
                this.ui.opts.className = "options-grid";
                this.ui.opts.style.gridTemplateColumns = "1fr 1fr"; // Side by side

                const btnTrue = document.createElement('div');
                btnTrue.className = 'option-card';
                btnTrue.innerHTML = '<span style="color:#00C851">✅ صح</span>';
                btnTrue.onclick = () => this.check(true, btnTrue);

                const btnFalse = document.createElement('div');
                btnFalse.className = 'option-card';
                btnFalse.innerHTML = '<span style="color:#ff4444">❌ خطأ</span>';
                btnFalse.onclick = () => this.check(false, btnFalse);

                this.ui.opts.appendChild(btnTrue);
                this.ui.opts.appendChild(btnFalse);

            } else if (q.t === 'in') {
                this.ui.qTag.innerText = 'أكمل الفراغ';
                this.ui.opts.style.display = 'none';
                this.ui.inputArea.style.display = 'block';
                this.ui.input.focus();
                
                // Allow enter key
                this.ui.input.onkeydown = (e) => {
                    if(e.key === 'Enter') this.checkInput();
                };
            }
        },

        check(userAns, element) {
            if (this.isBusy) return;
            this.isBusy = true;
            const q = questions[this.idx];
            const isCorrect = (userAns === q.a);

            if (isCorrect) {
                element.classList.add('correct');
                this.handleSuccess();
            } else {
                element.classList.add('wrong');
                this.handleFail();
                // Highlight correct if MCQ
                if(q.t === 'mcq') {
                    this.ui.opts.children[q.a].classList.add('correct');
                }
            }
            this.next();
        },

        checkInput() {
            if (this.isBusy) return;
            this.isBusy = true;
            const val = this.ui.input.value.trim().toLowerCase();
            const q = questions[this.idx];
            const isCorrect = q.a.includes(val);
            
            if (isCorrect) {
                this.ui.input.style.borderColor = 'var(--success)';
                this.ui.input.style.backgroundColor = 'rgba(0,200,81,0.1)';
                this.handleSuccess();
            } else {
                this.ui.input.style.borderColor = 'var(--wrong)';
                this.ui.input.style.backgroundColor = 'rgba(255,68,68,0.1)';
                this.ui.input.value += ` (${q.a[0]})`;
                this.handleFail();
            }
            this.next();
        },

        handleSuccess() {
            this.score++;
            this.streak++;
            playSound('correct');
            this.ui.score.innerText = this.score;
        },

        handleFail() {
            this.streak = 0;
            playSound('wrong');
            navigator.vibrate(200); // Mobile vibration
        },

        next() {
            setTimeout(() => {
                this.idx++;
                if (this.idx < questions.length) {
                    this.loadQ();
                } else {
                    this.end();
                }
            }, 1200);
        },

        end() {
            this.ui.game.classList.remove('active');
            this.ui.result.classList.add('active');
            
            const percent = Math.round((this.score / questions.length) * 100);
            
            // Animate Score
            let start = 0;
            const timer = setInterval(() => {
                start++;
                document.getElementById('finalScore').innerText = start;
                if(start >= percent) clearInterval(timer);
            }, 20);

            const medal = document.getElementById('finalMedal');
            const msg = document.getElementById('finalMsg');

            if(percent >= 90) {
                medal.innerText = "🥇";
                msg.innerText = "أسطورة أولمبية! أداء مثالي!";
                msg.style.color = "gold";
                playSound('win');
                confetti.start();
            } else if(percent >= 75) {
                medal.innerText = "🥈";
                msg.innerText = "ميدالية فضية! مستوى رائع.";
                msg.style.color = "silver";
            } else if(percent >= 50) {
                medal.innerText = "🥉";
                msg.innerText = "ميدالية برونزية. جيد، ولكن تدرب أكثر.";
                msg.style.color = "#cd7f32";
            } else {
                medal.innerText = "🤕";
                msg.innerText = "محاولة فاشلة. تحتاج لمراجعة قوانين اللعبة.";
                msg.style.color = "#ff4444";
            }
        }
    };

</script>
</body>
</html>
