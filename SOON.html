<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قريباً | Coming Soon</title>
    
    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/hourglass.png">

    <style>
        :root {
            --primary: #00e1ff;
            --secondary: #7000ff;
            --bg-dark: #050507;
            --glass-bg: rgba(20, 20, 25, 0.85); /* زجاج أغمق للقراءة أفضل */
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh; /* السماح بالتمدد */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* مسافة أمان للموبايل */
            position: relative;
            overflow-x: hidden; /* منع السكرول العرضي فقط */
        }

        /* الخلفية */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .blob {
            position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.3; z-index: -2;
        }
        .b1 { top: -10%; left: -10%; width: 70vw; height: 70vw; background: var(--secondary); }
        .b2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: var(--primary); }

        /* الكارت الرئيسي */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            padding: 40px 25px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 450px; /* عرض مناسب للموبايل */
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* الأيقونة */
        .icon-box {
            font-size: 3.5rem; margin-bottom: 15px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: floatIcon 3s infinite ease-in-out;
        }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* النصوص */
        h1 { font-size: 2rem; margin-bottom: 10px; font-weight: 800; line-height: 1.3; }
        p { color: #b0b0b0; font-size: 1rem; margin-bottom: 30px; line-height: 1.6; padding: 0 10px; }

        /* شريط التحميل */
        .progress-container {
            width: 100%; background: rgba(255,255,255,0.08);
            height: 6px; border-radius: 10px; margin-bottom: 35px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%; width: 85%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 10px var(--primary);
        }

        /* الزر */
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 20px;
            width: 100%; /* زر كامل العرض للموبايل */
            background: white; color: black;
            text-decoration: none; font-weight: 700;
            border-radius: 12px; font-size: 1rem;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); } /* تأثير ضغط الزر للمس */

        .status { margin-top: 20px; font-size: 0.75rem; color: #555; letter-spacing: 1px; font-family: monospace; }

        /* --- إعدادات خاصة للشاشات الصغيرة جداً --- */
        @media (max-width: 380px) {
            h1 { font-size: 1.6rem; }
            .card { padding: 30px 20px; }
            .icon-box { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>

    <div class="card">
        <div class="icon-box">
            <i class="fa-solid fa-rocket"></i>
        </div>
        
        <h1>المحتوى قادم قريباً</h1>
        <p>
            يتم الآن تجهيز وتنسيق محتوى هذه المادة.<br>
            قريباً ستجد الملخصات والكتب جاهزة.
        </p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <a href="javascript:history.back()" class="btn">
            العودة للصفحة السابقة <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="status">STATUS: PREPARING FILES... 85%</div>
    </div>

</body>
</html>
